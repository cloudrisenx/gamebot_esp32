; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Tombol Build/Upload VS Code hanya env ini. Env lightsleep WAJIB dari C:\cute_ls dengan
; PLATFORMIO_CORE_DIR=%USERPROFILE%\.platformio-ls (kalau tidak, pioarduino menimpa PlatformIO global).
[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.embed_txtfiles = web/ota.html
extra_scripts = post:scripts/copy_ota.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    fbiego/ChronosESP32
    ricmoo/QRCode


; ---- Percobaan light sleep + BLE (branch lightsleep) ----
; pioarduino = Arduino 3.x / ESP-IDF 5.x; custom_sdkconfig mengompilasi ulang lib IDF (hybrid compile)
[env:lightsleep]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.embed_txtfiles = web/ota.html
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    fbiego/ChronosESP32
    ricmoo/QRCode
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
    CONFIG_ESP_PHY_MAC_BB_PD=y
    # Pangkas ukuran (OTA hanya softAP WPA2 + WebServer + DNS). IPv6 tetap ON: esp-modbus bawaan Arduino butuh
    CONFIG_LWIP_IPV6=y
    CONFIG_ESP_WIFI_ENABLE_WPA3_SAE=n
    CONFIG_ESP_WIFI_ENABLE_SAE_PK=n
    CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT=n
    CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA=n
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
    CONFIG_ESP_WIFI_GCMP_SUPPORT=n
    CONFIG_ESP_WIFI_11KV_SUPPORT=n
    CONFIG_ESP_WIFI_MBO_SUPPORT=n
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
